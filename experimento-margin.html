<!DOCTYPE html>
<html>
<head>
    <title>Margin Collapse Experiment</title>
    <style>
        .elemento {
            padding: 20px;
            background: #D5E8F0;
            border: 1px solid #065A82;
        }
        .elemento-1 {
            margin-bottom: 40px;
        }
        .elemento-2 {
            margin-top: 60px;
            background: #FFD700; /* Amarillo para diferenciar */
        }
    </style>
</head>
<body>
    <div class="elemento elemento-1">
        Elemento 1 (margin-bottom: 40px)
    </div>
    <div class="elemento elemento-2">
        Elemento 2 (margin-top: 60px)
    </div>
</body>
</html>
